<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>React + FastAPI</title>
</head>
<body>
    <h1>Добро пожаловать в мою ассоциальную сеть</h1>
    <p id="result">Загрузка данных...</p>
    <script>
        fetch('https://api.kaktakte.ru/api/data')
            .then(response => response.json())
            .then(data => {
                document.getElementById('result').innerText = JSON.stringify(data);
            })
            .catch(err => {
                document.getElementById('result').innerText = 'Ошибка: ' + err;
            });
    </script>
</body>
</html>
