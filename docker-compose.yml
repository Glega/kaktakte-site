services:
  backend:
    build: ./backend
    container_name: fastapi_backend
    restart: always
    env_file:
      - .env
    networks:
      - shared_network
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: 
      context: ./frontend
      args:
          VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: react_frontend
    restart: always
    networks:
      - shared_network

  db:
    image: postgres:16-alpine
    container_name: kaktakte_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - shared_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  shared_network:
    external: true
    name: kaktakte_app_network

volumes:
  pgdata:
